services:
  ledger:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: ledger
    command: ./script/start.sh
    stdin_open: true
    tty: true
    depends_on:
      - ledger_db
    ports:
      - 3000:3000
    volumes:
      - .:/app
      - gem_cache:/usr/local/bundle
    env_file:
      - .env
    networks:
      - ledger_net

  ledger_db:
    image: "postgres:17"
    container_name: ledger_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    networks:
      - ledger_net

  redis:
    container_name: ledger_redis
    image: "redis:latest"
    command: redis-server
    volumes:
      - redis_data:/data
    networks:
      - ledger_net

volumes:
  postgres_data:
  gem_cache:
  redis_data:

networks:
  ledger_net:
